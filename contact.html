<section class="page-section">

    <h1 class="page-title">Contact <span>Me</span></h1>

    <p class="section-description">
        Have a project or idea? Feel free to contact me.
    </p>

    <div class="contact-container">

        <div class="contact-info">

            <h2>Let's Talk ♡</h2>

            <p>
                You can contact me using the information below.
            </p>

            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <a
                href="mailto:muskan.workspace01@gmail.com">
                muskan.workspace01@gmail.com 
                </a>
            </div>

            <div class="contact-item">
                <i class="fab fa-github"></i>
                <a
                href="https://github.com/muskan-dev01"
                target="_blank">
                muskan-dev01
                </a>

            </div>

            <div class="contact-item">
                <i class="fab fa-linkedin"></i>
                <a
                href="https://www.linkedin.com/in/Muskan Meer/"
                target="_blank">
                Muskan Meer
                </a>
            </div>

        </div>


        <form id="contactForm">

    <input type="text"
           name="name"
           placeholder="Your Name"
           required>

    <input type="email"
           name="email"
           placeholder="Your Email"
           required>

    <input type="text"
           name="subject"
           placeholder="Subject"
           required>

    <textarea name="message"
              rows="6"
              placeholder="Your Message"
              required></textarea>

    <button type="submit" class="btn">
        Send Message
    </button>

</form>
    </div>
